[project]
name = "libterraform"
dynamic = ["version"]
description = "Python binding for Terraform."
authors = [{ name = "Prodesire", email = "wangbinxin001@126.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["libterraform", "terraform"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/Prodesire/py-libterraform"
Repository = "https://github.com/Prodesire/py-libterraform"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pytest>=7.0.1",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.5.2",
    "tomli>=2.0.1",
    "ty>=0.0.42",
]
docs = [
    "mkdocstrings-python>=1.18.0; python_version >= '3.10'",
    "zensical>=0.0.43; python_version >= '3.10'",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run real Terraform operations and take longer",
]

[tool.ty.rules]
invalid-parameter-default = "ignore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/libterraform"]
artifacts = ["src/libterraform/libterraform.so", "src/libterraform/libterraform.dll"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.version]
path = "src/libterraform/__init__.py"
