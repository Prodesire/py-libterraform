name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-2022, macos-14 ]
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up GoLang
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/terraform/go.mod
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Build distributions
        run: |
          uv build --wheel
      - name: Run tests
        timeout-minutes: 15
        run: |
          uv run python -X faulthandler -m pytest -vv --durations=20 --timeout=120 --timeout-method=thread
      - name: Fix linux wheel tag
        if: runner.os == 'Linux'
        run: |
          python scripts/normalize_wheel_tags.py dist
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: libterraform-dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist
  build-macos-x64:
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14' ]
    runs-on: macos-14
    env:
      TARGET_ARCH: amd64
      _PYTHON_HOST_PLATFORM: macosx-14.0-x86_64
      ARCHFLAGS: -arch x86_64
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up GoLang
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/terraform/go.mod
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Build distributions
        run: |
          uv build --wheel
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: libterraform-dist-macos-x64-${{ matrix.python-version }}
          path: dist
  publish:
    needs: [ build, build-macos-x64 ]
    runs-on: macos-14
    environment:
      name: pypi
      url: https://pypi.org/p/libterraform
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: libterraform-dist-*
          path: dist
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
      - name: Publish to PyPI
        run: |
          for attempt in 1 2 3; do
            uv publish --trusted-publishing automatic --check-url https://pypi.org/simple/ dist/* && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          exit 1
