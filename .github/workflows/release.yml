name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-2022, macos-14 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up GoLang
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/terraform/go.mod
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Build distributions
        run: |
          uv build --wheel
      - name: Run tests
        timeout-minutes: 15
        run: |
          uv run python -X faulthandler -m pytest -vv --durations=20 --timeout=120 --timeout-method=thread
      - name: Fix linux wheel tag
        if: runner.os == 'Linux'
        run: |
          python scripts/normalize_wheel_tags.py dist
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: libterraform-dist-${{ matrix.os }}
          path: dist
  build-macos-x64:
    runs-on: macos-14
    env:
      TARGET_ARCH: amd64
      _PYTHON_HOST_PLATFORM: macosx-14.0-x86_64
      ARCHFLAGS: -arch x86_64
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up GoLang
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/terraform/go.mod
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Build distributions
        run: |
          uv build --wheel
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: libterraform-dist-macos-x64
          path: dist
  publish:
    needs: [ build, build-macos-x64 ]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/libterraform
    permissions:
      contents: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Download distribution artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: libterraform-dist-*
          path: dist
          merge-multiple: true
      - name: Verify distribution artifacts
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import sys

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          expected_count = 4
          if len(wheels) != expected_count:
              names = "\n".join(path.name for path in wheels)
              sys.exit(
                  f"Expected {expected_count} wheel artifacts, found {len(wheels)}:\n"
                  f"{names}"
              )

          counts = Counter(path.name for path in wheels)
          duplicates = sorted(name for name, count in counts.items() if count > 1)
          if duplicates:
              sys.exit(f"Duplicate wheel artifacts: {', '.join(duplicates)}")

          for path in wheels:
              data = path.read_bytes()
              signature = b"PK\x05\x06"
              eocd = data.rfind(signature)
              if eocd < 0:
                  sys.exit(f"Missing ZIP end-of-central-directory record: {path.name}")
              if eocd + 22 > len(data):
                  sys.exit(f"Truncated ZIP end-of-central-directory record: {path.name}")
              comment_length = int.from_bytes(data[eocd + 20 : eocd + 22], "little")
              expected_end = eocd + 22 + comment_length
              if expected_end != len(data):
                  sys.exit(f"Trailing data after ZIP archive: {path.name}")
          PY
      - name: Create Release
        uses: softprops/action-gh-release@v2
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/* && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          exit 1
