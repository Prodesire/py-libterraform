[project]
site_name = "Python libterraform"
site_description = "Terraform 的 Python 绑定。"
site_url = "https://prodesire.github.io/py-libterraform/zh/"
repo_url = "https://github.com/Prodesire/py-libterraform"
repo_name = "Prodesire/py-libterraform"
edit_uri = "edit/main/docs/zh/"
docs_dir = "docs/zh"
site_dir = "site/zh"
extra_javascript = ["assets/language-redirect.js"]
nav = [
  { "首页" = "index.md" },
  { "入门" = [
    { "安装" = "installation.md" },
    { "快速开始" = "quickstart.md" },
    { "并行执行" = "parallel-execution.md" },
  ] },
  { "API 参考" = [
    { "概览" = "api/index.md" },
    { "TerraformCommand" = "api/terraform-command.md" },
    { "AsyncTerraformCommand" = "api/async-terraform-command.md" },
    { "TerraformPool" = "api/terraform-pool.md" },
    { "TerraformConfig" = "api/terraform-config.md" },
    { "异常" = "api/exceptions.md" },
  ] },
  { "开发" = [
    { "开发指南" = "development.md" },
    { "发布策略" = "release-policy.md" },
  ] },
]

[project.theme]
language = "zh"
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "content.code.copy",
  "content.action.edit",
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
filters = ["!^_"]
members_order = "source"
separate_signature = true
show_docstring_attributes = false
show_docstring_classes = false
show_docstring_description = false
show_docstring_examples = false
show_docstring_functions = false
show_docstring_modules = false
show_docstring_other_parameters = false
show_docstring_parameters = false
show_docstring_raises = false
show_docstring_receives = false
show_docstring_returns = false
show_docstring_warns = false
show_docstring_yields = false
show_root_heading = true
show_signature_annotations = true
show_source = false

[project.extra]
alternate = [
  { name = "English", link = "https://prodesire.github.io/py-libterraform/?lang=en", lang = "en" },
  { name = "中文", link = "https://prodesire.github.io/py-libterraform/zh/", lang = "zh" },
]
